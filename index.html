<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honolulu Traffic Incidents</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; top: 10px; right: 10px; z-index: 1000; background: #fff; padding: 8px 12px;
           border-radius: 6px; box-shadow: 0 1px 4px #0004; max-width: 260px; }
  #panel h1 { font-size: 15px; margin: 0 0 4px; }
  #status { color: #444; margin-bottom: 6px; }
  .key { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .key input { margin: 0; }
  .key .n { margin-left: auto; padding-left: 8px; color: #666; font-variant-numeric: tabular-nums; }
  .cluster { width: 26px; height: 26px; border-radius: 50%; background: #333; color: #fff; font-weight: 600;
             display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 0 3px #000; }
  .cluster.approx { opacity: .6; border-style: dashed; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #0006; }
</style>
</head>
<body>
<div id="map" role="region" aria-label="Map of Oahu traffic incidents"></div>
<div id="panel"><h1>Honolulu Traffic Incidents</h1><div id="status" aria-live="polite">Loading…</div><div id="legend"></div></div>
<script type="module">
import { FEED, keyOf, geocode as lookup } from './geo.js';
const REFRESH_MS = 5 * 60 * 1000; // feed updates about every 5 minutes
const COLORS = { 'MVC': '#d62728', 'MVC Veh Towed': '#8c1d1d', 'Traffic Incident': '#ff7f0e', 'Hazardous Driver': '#9467bd',
                 'Stalled/Hazard Veh': '#e7ba00', 'Traffic Control Device': '#1f77b4', 'Traffic Complaint': '#2ca02c' };

const map = L.map('map').setView([21.46, -157.98], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors | Data: data.honolulu.gov' }).addTo(map);
const layer = L.layerGroup().addTo(map);
const $status = document.getElementById('status');
let hidden = new Set(); // incident types unticked in the legend, remembered across reloads
try { hidden = new Set(JSON.parse(localStorage.getItem('hidden') || '[]')); } catch {}
const $legend = document.getElementById('legend');
$legend.innerHTML = Object.entries(COLORS).map(([t, c]) =>
  `<label class="key"><input type="checkbox" value="${t}"${hidden.has(t) ? '' : ' checked'}><span class="dot" style="background:${c}"></span>${t}<span class="n"></span></label>`).join('');
$legend.addEventListener('change', e => {
  e.target.checked ? hidden.delete(e.target.value) : hidden.add(e.target.value);
  try { localStorage.setItem('hidden', JSON.stringify([...hidden])); } catch {}
  layer.clearLayers(); groups = {};
  placed.forEach(([r, g]) => addMarker(r, g));
});

// Geocode cache: Nominatim's usage policy requires caching; localStorage just makes reloads fast.
let cache = {};
try { ['geo', 'geo2'].forEach(k => localStorage.removeItem(k)); cache = JSON.parse(localStorage.getItem('geo3') || '{}'); } catch {} // older keys hold results from earlier geocoding rules
const saveCache = () => { try { localStorage.setItem('geo3', JSON.stringify(cache)); } catch {} };

async function geocode(r) {
  const key = keyOf(r);
  if (key in cache) return cache[key];
  cache[key] = await lookup(r); saveCache();
  return cache[key];
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const describe = r => `<b>${esc(r.type)}</b><br>${esc(r.date)} ${esc(r.time)}<br>${esc(r.address)}` +
  (r.location ? `<br>${esc(r.location)}` : '') + `<br>${esc(r.area)}`;
let groups = {}; // "lat,lon" -> { marker, rows }: incidents at the same spot share one marker
let placed = []; // [incident, location] pairs from the latest refresh, redrawn when the filter changes
function addMarker(r, g) {
  if (hidden.has(r.type)) return;
  const key = g.ll.join(), grp = groups[key] ??= { rows: [] };
  grp.rows.push(r);
  grp.marker?.remove();
  const n = grp.rows.length;
  grp.marker = n === 1
    ? L.circleMarker(g.ll, { radius: 7, weight: 1, color: '#000', fillOpacity: g.approx ? 0.45 : 0.9,
                             fillColor: COLORS[r.type] || '#777', dashArray: g.approx ? '2' : null })
    : L.marker(g.ll, { title: `${n} incidents`, icon: L.divIcon({ className: '', iconSize: [26, 26],
        html: `<div class="cluster${g.approx ? ' approx' : ''}">${n}</div>` }) });
  grp.marker.bindPopup(grp.rows.map(describe).join('<hr>') +
      (g.approx ? '<br><i>Approximate location (street/area only)</i>' : ''), { maxHeight: 300 })
    .addTo(layer);
}

let run = 0;
async function refresh() {
  const id = ++run; // a newer refresh supersedes one still geocoding
  let rows;
  try {
    const res = await fetch(FEED);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    rows = await res.json();
  } catch (e) { $status.textContent = `Feed error: ${e.message}. Retrying in 5 min.`; return; }
  // Precomputed by the scheduled GitHub Action; the page only geocodes addresses newer than that file.
  try { Object.assign(cache, await (await fetch('geocodes.json', { cache: 'no-cache' })).json()); } catch {}
  for (const i of $legend.querySelectorAll('input'))
    i.parentElement.querySelector('.n').textContent = rows.filter(r => r.type === i.value).length;
  layer.clearLayers(); groups = {}; placed = [];
  const stamp = new Date().toLocaleTimeString();
  let mapped = 0, missed = 0, done = 0;
  const show = () => $status.textContent = `Updated ${stamp} · ${rows.length} incidents · ${mapped} mapped` +
    (missed ? ` · ${missed} not found` : '') + (done < rows.length ? ` · locating ${rows.length - done}…` : '');
  show();
  for (const r of rows) {
    if (id !== run) return;
    let g = null;
    try { g = await geocode(r); } catch (e) { console.warn(e); } // transient geocoder error: not cached, retried next refresh
    if (id !== run) return;
    g ? (placed.push([r, g]), addMarker(r, g), mapped++) : missed++;
    done++; show();
  }
}
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
