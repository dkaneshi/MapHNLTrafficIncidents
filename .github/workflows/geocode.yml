name: Precompute geocodes
on:
  schedule:
    - cron: '*/5 * * * *' # GitHub's minimum; runs are often delayed, and the page geocodes anything missing
  workflow_dispatch:
permissions:
  contents: write
concurrency: geocode
jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node scripts/geocode.mjs
      - name: Commit if changed
        run: |
          git diff --quiet geocodes.json 2>/dev/null && [ -z "$(git status --porcelain geocodes.json)" ] && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add geocodes.json
          git commit -m 'Update geocodes'
          git push
